<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Secure Password Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="range"] { width: 100%; }
        .length-display { text-align: center; font-weight: bold; font-size: 1.25rem; color: var(--primary); }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f1f5f9;
            border-radius: 0.5rem;
            position: relative;
            display: none;
        }
        .result-text {
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
            padding-right: 2rem;
        }
        .copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            width: auto;
            color: #64748b;
        }
        .copy-btn:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Password Generator</h1>
        <div class="form-group">
            <label for="length">Password Length: <span id="lengthVal" class="length-display">12</span></label>
            <input type="range" id="length" min="1" max="30" value="12">
        </div>
        <button id="generate">Generate Password</button>

        <div id="result" class="result-container">
            <div id="passwordOutput" class="result-text"></div>
            <button class="copy-btn" id="copy" title="Copy to clipboard">📋</button>
        </div>
    </div>

    <script>
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('lengthVal');
        const generateBtn = document.getElementById('generate');
        const resultDiv = document.getElementById('result');
        const output = document.getElementById('passwordOutput');
        const copyBtn = document.getElementById('copy');

        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lower = "abcdefghijklmnopqrstuvwxyz";
        const numbers = "0123456789";
        const special = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
        const all = upper + lower + numbers + special;

        lengthInput.addEventListener('input', () => {
            lengthVal.textContent = lengthInput.value;
        });

        function generatePassword(len) {
            let password = [];
            if (len >= 4) {
                password.push(upper[Math.floor(Math.random() * upper.length)]);
                password.push(lower[Math.floor(Math.random() * lower.length)]);
                password.push(numbers[Math.floor(Math.random() * numbers.length)]);
                password.push(special[Math.floor(Math.random() * special.length)]);
                for (let i = 0; i < len - 4; i++) {
                    password.push(all[Math.floor(Math.random() * all.length)]);
                }
            } else {
                for (let i = 0; i < len; i++) {
                    password.push(all[Math.floor(Math.random() * all.length)]);
                }
            }
            // Shuffle
            for (let i = password.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [password[i], password[j]] = [password[j], password[i]];
            }
            return password.join('');
        }

        generateBtn.addEventListener('click', () => {
            const password = generatePassword(parseInt(lengthInput.value));
            output.textContent = password;
            resultDiv.style.display = 'block';
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(output.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅';
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });
    </script>
</body>
</html>
