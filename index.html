<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Secure Password Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --super-strong: #10b981;
            --strong: #3b82f6;
            --good: #f59e0b;
            --basic: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 2rem; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .mode-option {
            border: 2px solid #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .mode-option.active {
            border-color: var(--primary);
            background-color: #eef2ff;
            color: var(--primary);
        }

        input[type="range"] { width: 100%; cursor: pointer; }
        .length-display { text-align: center; font-weight: bold; font-size: 1.25rem; color: var(--primary); }
        
        .strength-meter {
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }
        .strength-label {
            font-size: 0.8rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 0.25rem;
        }

        button.generate-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1rem;
        }
        button.generate-btn:hover { background-color: var(--primary-hover); }

        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f1f5f9;
            border-radius: 0.5rem;
            position: relative;
            display: none;
            border-left: 4px solid var(--primary);
        }
        .result-text {
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
            padding-right: 2.5rem;
        }
        .copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            width: auto;
            color: #64748b;
            font-size: 1.2rem;
        }
        .copy-btn:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Password Generator</h1>
        <p class="subtitle">Securely generated for your protection</p>
        
        <div class="form-group">
            <label>Security Level</label>
            <div class="mode-selector">
                <div class="mode-option active" data-mode="Strong">Strong</div>
                <div class="mode-option" data-mode="Super Strong">Super Strong</div>
            </div>
        </div>

        <div class="form-group">
            <label for="length">Password Length: <span id="lengthVal" class="length-display">12</span></label>
            <input type="range" id="length" min="1" max="30" value="12">
        </div>

        <div class="strength-label" id="strengthLabel">Good</div>
        <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"></div>
        </div>

        <button class="generate-btn" id="generate">Generate Password</button>

        <div id="result" class="result-container">
            <div id="passwordOutput" class="result-text"></div>
            <button class="copy-btn" id="copy" title="Copy to clipboard">📋</button>
        </div>
    </div>

    <script>
        const lengthInput = document.getElementById('length');
        const lengthVal = document.getElementById('lengthVal');
        const generateBtn = document.getElementById('generate');
        const resultDiv = document.getElementById('result');
        const output = document.getElementById('passwordOutput');
        const copyBtn = document.getElementById('copy');
        const modeOptions = document.querySelectorAll('.mode-option');
        const strengthBar = document.getElementById('strengthBar');
        const strengthLabel = document.getElementById('strengthLabel');

        let currentMode = 'Strong';

        const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lower = "abcdefghijklmnopqrstuvwxyz";
        const numbers = "0123456789";
        const special = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";
        const all = upper + lower + numbers + special;

        function updateStrength() {
            const len = parseInt(lengthInput.value);
            let score = 0;
            if (len > 8) score++;
            if (len > 12) score++;
            if (len > 16) score++;
            if (currentMode === 'Super Strong') score++;

            let color, label, width;
            if (score <= 1) {
                color = '#ef4444'; label = 'Basic'; width = '25%';
            } else if (score === 2) {
                color = '#f59e0b'; label = 'Good'; width = '50%';
            } else if (score === 3) {
                color = '#3b82f6'; label = 'Strong'; width = '75%';
            } else {
                color = '#10b981'; label = 'Super Strong'; width = '100%';
            }
            
            strengthBar.style.width = width;
            strengthBar.style.backgroundColor = color;
            strengthLabel.textContent = label;
            strengthLabel.style.color = color;
        }

        modeOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                modeOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                currentMode = opt.dataset.mode;
                
                if (currentMode === 'Super Strong' && lengthInput.value < 8) {
                    lengthInput.value = 8;
                    lengthVal.textContent = 8;
                }
                lengthInput.min = (currentMode === 'Super Strong') ? 8 : 1;
                updateStrength();
            });
        });

        lengthInput.addEventListener('input', () => {
            lengthVal.textContent = lengthInput.value;
            updateStrength();
        });

        function generatePassword(len, mode) {
            let password = [];
            if (mode === 'Super Strong') {
                for (let j = 0; j < 2; j++) {
                    password.push(upper[Math.floor(Math.random() * upper.length)]);
                    password.push(lower[Math.floor(Math.random() * lower.length)]);
                    password.push(numbers[Math.floor(Math.random() * numbers.length)]);
                    password.push(special[Math.floor(Math.random() * special.length)]);
                }
                for (let i = 0; i < len - 8; i++) {
                    password.push(all[Math.floor(Math.random() * all.length)]);
                }
            } else if (len >= 4) {
                password.push(upper[Math.floor(Math.random() * upper.length)]);
                password.push(lower[Math.floor(Math.random() * lower.length)]);
                password.push(numbers[Math.floor(Math.random() * numbers.length)]);
                password.push(special[Math.floor(Math.random() * special.length)]);
                for (let i = 0; i < len - 4; i++) {
                    password.push(all[Math.floor(Math.random() * all.length)]);
                }
            } else {
                for (let i = 0; i < len; i++) {
                    password.push(all[Math.floor(Math.random() * all.length)]);
                }
            }
            // Shuffle
            for (let i = password.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [password[i], password[j]] = [password[j], password[i]];
            }
            return password.join('');
        }

        generateBtn.addEventListener('click', () => {
            const password = generatePassword(parseInt(lengthInput.value), currentMode);
            output.textContent = password;
            resultDiv.style.display = 'block';
            resultDiv.style.borderLeftColor = (currentMode === 'Super Strong') ? '#10b981' : '#4f46e5';
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(output.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✅';
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });

        // Init
        updateStrength();
    </script>
</body>
</html>
